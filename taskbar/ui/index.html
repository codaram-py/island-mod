<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>codabar</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        padding: var(--margin, 0px);
      }
      .bar {
        display: flex;
        align-items: center;
        height: 100%;
        padding: 0 8px;
        gap: var(--gap);
      }
      .zone {
        display: flex;
        align-items: center;
        gap: var(--gap);
        min-width: 0;
      }
      .zone.center {
        flex: 1;
        justify-content: center;
      }
      .zone.right {
        margin-left: auto;
      }
      #clock {
        flex-direction: column;
        align-items: flex-end;
        gap: 0;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
      }
      #clock .date {
        font-size: 0.82em;
        color: var(--muted);
      }
      .hidden {
        display: none !important;
      }
      /* Left/right edges: the bar runs down the screen instead of across. */
      body.vertical .bar {
        flex-direction: column;
        padding: 8px 0;
      }
      body.vertical .zone {
        flex-direction: column;
      }
      body.vertical .zone.right {
        margin-left: 0;
        margin-top: auto;
      }
      body.vertical .pill {
        height: auto;
        min-height: 32px;
        padding: 6px 4px;
        justify-content: center;
      }
      body.vertical #clock {
        align-items: center;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="bar surface">
      <div class="zone left" id="left"></div>
      <div class="zone center" id="center"></div>
      <div class="zone right" id="right"></div>
    </div>
    <script type="module" src="bar.js"></script>
  </body>
</html>
