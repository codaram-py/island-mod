<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>codabar</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        padding: var(--margin);
      }
      /* The centre row is centred on the screen, and the right-hand side is
         lifted out of the flow so it stays pinned to the corner however many
         windows are open -- otherwise a full centre would push it off. */
      .bar {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      #center {
        display: flex;
        align-items: center;
        gap: var(--gap);
      }
      #right {
        position: absolute;
        right: 0;
        top: 0;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 2px;
        padding-right: 12px;
      }
      #apps {
        display: flex;
        align-items: center;
        gap: var(--gap);
      }

      /* Left or right edge: the bar runs down the screen, so the centre
         stacks and the right-hand side sits at the bottom instead. */
      body.vertical .bar {
        flex-direction: column;
        justify-content: flex-start;
        padding: 8px 0;
      }
      body.vertical #center,
      body.vertical #apps,
      body.vertical #right {
        flex-direction: column;
      }
      body.vertical #right {
        position: static;
        margin-top: auto;
        height: auto;
        padding: 0 0 8px;
      }
      body.vertical .rule {
        width: 24px;
        height: 1px;
        margin: 4px 0;
      }
      body.vertical #clock {
        align-items: center;
      }
      body.vertical .sliver {
        width: 100%;
        height: 5px;
        top: auto;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="bar surface">
      <div id="center"></div>
      <div id="right"></div>
      <button class="sliver" id="showdesktop" title="Mostrar a área de trabalho"></button>
    </div>
    <script type="module" src="bar.js"></script>
  </body>
</html>
