<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Windows 11 Taskbar</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
a { color: #fff; } a:hover { color: #ccc; }
</style>
</helmet>

<div style="width: 1920px; height: 52px; box-sizing: border-box; background: rgba(32, 32, 32, 0.92); display: flex; align-items: center; justify-content: center; position: relative; backdrop-filter: blur(20px)">

  <!-- Ícones centrais da taskbar -->
  <div style="display: flex; align-items: center; gap: 4px">

    <!-- Windows -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="1" y="1" width="8.5" height="8.5" rx="1.5" fill="#0078D4"></rect>
        <rect x="10.5" y="1" width="8.5" height="8.5" rx="1.5" fill="#0078D4"></rect>
        <rect x="1" y="10.5" width="8.5" height="8.5" rx="1.5" fill="#0078D4"></rect>
        <rect x="10.5" y="10.5" width="8.5" height="8.5" rx="1.5" fill="#0078D4"></rect>
      </svg>
    </div>

    <!-- Copilot / Estrela azul -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L14.5 8.5L21 9.5L16 14L17.5 21L12 17.5L6.5 21L8 14L3 9.5L9.5 8.5L12 2Z" fill="#26C6DA" stroke="#26C6DA" stroke-width="0.5"></path>
      </svg>
    </div>

    <!-- Vivaldi -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#EF3939"></circle>
        <path d="M8 7C8 7 10 12 12 17C14 12 16 7 16 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
      </svg>
    </div>

    <!-- Brave -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L20 7V17L12 22L4 17V7L12 2Z" fill="#FB542B"></path>
        <path d="M12 6L16 9V15L12 18L8 15V9L12 6Z" fill="white" fill-opacity="0.3"></path>
      </svg>
    </div>

    <!-- Opera GX -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#FF1B2D"></circle>
        <ellipse cx="12" cy="12" rx="5" ry="8" fill="#1a1a2e" stroke="#FF1B2D" stroke-width="1"></ellipse>
      </svg>
    </div>

    <!-- Firefox -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#FF9500"></circle>
        <circle cx="12" cy="13" r="6" fill="#E66000"></circle>
        <circle cx="12" cy="13" r="4" fill="#3023AE" fill-opacity="0.4"></circle>
        <path d="M16 6C16 6 18 4 19 5C18 7 17 8 16 8C15 8 16 6 16 6Z" fill="#FF9500"></path>
      </svg>
    </div>

    <!-- Reddit -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#FF4500"></circle>
        <circle cx="9" cy="11" r="1.5" fill="white"></circle>
        <circle cx="15" cy="11" r="1.5" fill="white"></circle>
        <path d="M8.5 15C8.5 15 10 17 12 17C14 17 15.5 15 15.5 15" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
        <circle cx="16" cy="5" r="1.5" fill="white"></circle>
        <line x1="12" y1="4" x2="15" y2="5" stroke="white" stroke-width="1"></line>
        <circle cx="12" cy="4" r="1.5" fill="white"></circle>
      </svg>
    </div>

    <!-- Spotify -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#1DB954"></circle>
        <path d="M7 10.5C7 10.5 10 9.5 17 11" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"></path>
        <path d="M7.5 13.5C7.5 13.5 10 12.5 16 14" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"></path>
        <path d="M8 16.5C8 16.5 10.5 15.5 15 17" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
      </svg>
    </div>

    <!-- File Explorer -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M2 6C2 5 3 4 4 4H9L11 6H20C21 6 22 7 22 8V18C22 19 21 20 20 20H4C3 20 2 19 2 18V6Z" fill="#FFB900"></path>
        <rect x="2" y="9" width="20" height="11" rx="1" fill="#FCD116"></rect>
      </svg>
    </div>

    <!-- File Explorer 2 (Pastas) -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M2 6C2 5 3 4 4 4H9L11 6H20C21 6 22 7 22 8V18C22 19 21 20 20 20H4C3 20 2 19 2 18V6Z" fill="#48A9A6"></path>
        <rect x="2" y="9" width="20" height="11" rx="1" fill="#5EC4C1"></rect>
      </svg>
    </div>

    <!-- Teams / Chat -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="4" width="20" height="16" rx="3" fill="#7B83EB"></rect>
        <circle cx="9" cy="10" r="2.5" fill="white"></circle>
        <circle cx="15" cy="10" r="2" fill="white" fill-opacity="0.7"></circle>
        <rect x="6" y="14" width="6" height="3" rx="1.5" fill="white"></rect>
      </svg>
    </div>

    <!-- VS Code -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M17 2L22 5V19L17 22L2 12L7 8L17 16V8L7 16L2 12" fill="#007ACC" fill-opacity="0.8"></path>
        <path d="M17 2L22 5V19L17 22V2Z" fill="#1E8ED7"></path>
        <path d="M2 12L7 8L17 16" stroke="white" stroke-width="0.5" fill="none"></path>
      </svg>
    </div>

    <!-- Terminal -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="3" width="20" height="18" rx="3" fill="#1E1E1E"></rect>
        <rect x="2" y="3" width="20" height="5" rx="3" fill="#333"></rect>
        <circle cx="5.5" cy="5.5" r="1" fill="#FF5F57"></circle>
        <circle cx="8.5" cy="5.5" r="1" fill="#FEBC2E"></circle>
        <circle cx="11.5" cy="5.5" r="1" fill="#28C840"></circle>
        <path d="M6 13L9 15.5L6 18" stroke="#28C840" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        <line x1="11" y1="18" x2="17" y2="18" stroke="#666" stroke-width="1.5" stroke-linecap="round"></line>
      </svg>
    </div>

    <!-- Discord -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="1" y="1" width="22" height="22" rx="5" fill="#5865F2"></rect>
        <path d="M9 10.5C9 10.5 9 9 10 9C11 9 11 10.5 11 10.5C11 10.5 11 12 10 12C9 12 9 10.5 9 10.5Z" fill="white"></path>
        <path d="M13 10.5C13 10.5 13 9 14 9C15 9 15 10.5 15 10.5C15 10.5 15 12 14 12C13 12 13 10.5 13 10.5Z" fill="white"></path>
        <path d="M7 8C7 8 9 7 12 7C15 7 17 8 17 8" stroke="white" stroke-width="1.2" stroke-linecap="round" fill="none"></path>
        <path d="M8 15C8 15 9 16.5 12 16.5C15 16.5 16 15 16 15" stroke="white" stroke-width="1.2" stroke-linecap="round" fill="none"></path>
      </svg>
    </div>

    <!-- OBS -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#1B1B1B"></circle>
        <circle cx="12" cy="12" r="7" stroke="#CCCCCC" stroke-width="1.5" fill="none"></circle>
        <circle cx="12" cy="12" r="3" fill="#CCCCCC"></circle>
      </svg>
    </div>

    <!-- Lixeira -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M5 6H19L18 20H6L5 6Z" fill="#888"></path>
        <rect x="3" y="4" width="18" height="2" rx="1" fill="#aaa"></rect>
        <rect x="9" y="2" width="6" height="2" rx="1" fill="#aaa"></rect>
        <line x1="9" y1="9" x2="9" y2="17" stroke="#555" stroke-width="1"></line>
        <line x1="12" y1="9" x2="12" y2="17" stroke="#555" stroke-width="1"></line>
        <line x1="15" y1="9" x2="15" y2="17" stroke="#555" stroke-width="1"></line>
      </svg>
    </div>

    <!-- Notepad -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <rect x="4" y="2" width="16" height="20" rx="2" fill="#2D2D30"></rect>
        <line x1="8" y1="7" x2="16" y2="7" stroke="#569CD6" stroke-width="1.2"></line>
        <line x1="8" y1="10" x2="14" y2="10" stroke="#569CD6" stroke-width="1.2"></line>
        <line x1="8" y1="13" x2="16" y2="13" stroke="#569CD6" stroke-width="1.2"></line>
        <line x1="8" y1="16" x2="12" y2="16" stroke="#569CD6" stroke-width="1.2"></line>
      </svg>
    </div>

    <!-- Paint -->
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="2" fill="white" fill-opacity="0.9"></rect>
        <circle cx="7" cy="18" r="2" fill="#FF4444"></circle>
        <circle cx="12" cy="18" r="2" fill="#4488FF"></circle>
        <circle cx="17" cy="18" r="2" fill="#44CC44"></circle>
        <path d="M6 5L10 14" stroke="#FF4444" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    </div>

  </div>

  <!-- System tray - lado direito -->
  <div style="position: absolute; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 2px; padding-right: 12px">

    <!-- Seta para cima (hidden icons) -->
    <div style="width: 28px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M2 7L5 3L8 7" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </div>

    <!-- Tray icons pequenos -->
    <div style="display: flex; align-items: center; gap: 1px; padding: 0 4px">
      <div style="width: 18px; height: 18px; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="7" cy="7" r="5" fill="#E53935"></circle>
          <line x1="5" y1="7" x2="9" y2="7" stroke="white" stroke-width="1.5"></line>
        </svg>
      </div>
      <div style="width: 18px; height: 18px; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="7" cy="7" r="5" fill="#43A047"></circle>
        </svg>
      </div>
      <div style="width: 18px; height: 18px; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="7" cy="7" r="5" stroke="#aaa" stroke-width="1" fill="none"></circle>
          <circle cx="7" cy="7" r="2" fill="#aaa"></circle>
        </svg>
      </div>
      <div style="width: 18px; height: 18px; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <rect x="2" y="4" width="10" height="7" rx="1" stroke="#aaa" stroke-width="1" fill="none"></rect>
          <rect x="4" y="6" width="4" height="3" fill="#aaa"></rect>
        </svg>
      </div>
    </div>

    <!-- Separador -->
    <div style="width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 4px"></div>

    <!-- Idioma -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 8px; border-radius: 4px; cursor: pointer; line-height: 1.1">
      <span style="font-size: 10px; color: #ccc; font-weight: 600; letter-spacing: 0.5px">POR</span>
      <span style="font-size: 9px; color: #999; letter-spacing: 0.3px">PTB2</span>
    </div>

    <!-- Separador -->
    <div style="width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 4px"></div>

    <!-- Ícones de rede/som/bateria -->
    <div style="display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 4px; cursor: pointer">
      <!-- Terminal sozinho -->
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <rect x="1" y="2" width="14" height="12" rx="2" fill="none" stroke="#ccc" stroke-width="1.2"></rect>
        <path d="M4 6L7 8.5L4 11" stroke="#ccc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        <line x1="8" y1="11" x2="12" y2="11" stroke="#ccc" stroke-width="1.2" stroke-linecap="round"></line>
      </svg>
      <!-- Audio + Mic empilhados -->
      <div style="display: flex; flex-direction: column; gap: 2px; align-items: center">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <path d="M2 6H5L9 3V13L5 10H2V6Z" fill="#ccc"></path>
          <path d="M11 5.5C11 5.5 12.5 7 12.5 8C12.5 9 11 10.5 11 10.5" stroke="#ccc" stroke-width="1.2" stroke-linecap="round" fill="none"></path>
          <path d="M12 3.5C12 3.5 14.5 6 14.5 8C14.5 10 12 12.5 12 12.5" stroke="#ccc" stroke-width="1.2" stroke-linecap="round" fill="none"></path>
        </svg>
        <svg width="10" height="10" viewBox="0 0 16 16" fill="none">
          <rect x="5.5" y="1" width="5" height="9" rx="2.5" fill="#ccc"></rect>
          <path d="M3.5 7.5C3.5 7.5 3.5 11 8 11C12.5 11 12.5 7.5 12.5 7.5" stroke="#ccc" stroke-width="1.3" stroke-linecap="round" fill="none"></path>
          <line x1="8" y1="11" x2="8" y2="13.5" stroke="#ccc" stroke-width="1.3" stroke-linecap="round"></line>
          <line x1="5.5" y1="13.5" x2="10.5" y2="13.5" stroke="#ccc" stroke-width="1.3" stroke-linecap="round"></line>
        </svg>
      </div>
      <!-- Wi-Fi + Bluetooth empilhados -->
      <div style="display: flex; flex-direction: column; gap: 2px; align-items: center">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
          <path d="M1 5.5C1 5.5 4 2 8 2C12 2 15 5.5 15 5.5" stroke="#ccc" stroke-width="1.3" stroke-linecap="round" fill="none"></path>
          <path d="M3 8C3 8 5 5.5 8 5.5C11 5.5 13 8 13 8" stroke="#ccc" stroke-width="1.3" stroke-linecap="round" fill="none"></path>
          <path d="M5.5 10.5C5.5 10.5 6.5 9 8 9C9.5 9 10.5 10.5 10.5 10.5" stroke="#ccc" stroke-width="1.3" stroke-linecap="round" fill="none"></path>
          <circle cx="8" cy="13" r="1" fill="#ccc"></circle>
        </svg>
        <svg width="9" height="9" viewBox="0 0 16 16" fill="none">
          <path d="M4,5 L12,11 L8,15 V1 L12,5 L4,11" stroke="#4A9FD9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        </svg>
      </div>
    </div>

    <!-- Separador -->
    <div style="width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 4px"></div>

    <!-- Relógio e Data -->
    <div style="display: flex; flex-direction: column; align-items: flex-end; justify-content: center; padding: 4px 8px; border-radius: 4px; cursor: pointer; line-height: 1.2">
      <span style="font-size: 12px; color: #fff; font-weight: 400">{{time}}</span>
      <span style="font-size: 11px; color: #ccc; font-weight: 400">{{date}}</span>
    </div>

  </div>

  <!-- Show Desktop strip - canto absoluto direito -->
  <div style="position: absolute; right: 0; top: 0; width: 5px; height: 52px; cursor: pointer; background: rgba(255,255,255,0.15)">
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"time":{"editor":"text","default":"16:03"},"date":{"editor":"text","default":"27/10/2026"},"$preview":{"width":1920,"height":52}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      time: this.props.time ?? '16:03',
      date: this.props.date ?? '27/10/2026'
    };
  }
}
</script>
</body>
</html>
